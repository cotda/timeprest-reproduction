[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timeprest"
version = "0.1.0"
description = "Reproduction of TiMePReSt (FGCS 2026) pipeline-parallel training on top of PipeDream ideas"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pyyaml>=6.0",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["timeprest*"]

[tool.pytest.ini_options]
testpaths = ["timeprest/tests"]
