# D1-D4 for ResNet-50 / Tiny-ImageNet (TiMePReSt and PipeDream).
#     torchrun --standalone --nproc_per_node=2 -m timeprest.dist.checks --config configs/tin_r50_quick.yaml
base: tin_quick.yaml
name: tin_r50_quick
model:
  name: resnet50
  num_classes: 200
  stem: conv3_pool
  zero_init_residual: true         # without it ResNet-50 diverged early (Kaggle D4/sweep, paper_notes §25.1)
output:
  dir: /kaggle/working/runs/tin_r50_quick
checks:
  systems: [pipedream, timeprest]
