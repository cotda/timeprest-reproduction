# VGG-16-BN / Tiny-ImageNet-200 on the real 2-GPU pipeline (Kaggle T4 x2), paper_notes §24.
# Same recipe as CIFAR phase 2/3 (kaggle_base.yaml) except data, head and epochs.
base: kaggle_base.yaml
data:
  dataset: tinyimagenet
  root: /kaggle/input              # searched for tiny-imagenet-200/wnids.txt (any attached dataset)
  cache_dir: /kaggle/working/tin_cache   # decoded uint8 arrays (.npy, ~1.3 GB), reused by later runs
  download: false
  augment: true                    # choice: random crop 64 pad 4 + horizontal flip (as CIFAR)
  num_workers: 2
model:
  name: vgg16_bn
  num_classes: 200
  global_pool: true                # choice: 64x64 input -> 2x2x512, averaged before Linear(512, 200)
training:
  epochs: 80                       # choice (user, 2026-09-25): paper Fig.8b runs ~140 epochs
  warmup_epochs: 5
  lr: 0.02                         # placeholder until configs/tin_sweep.yaml; per-system values below
output:
  dir: /kaggle/working/runs/{name}
