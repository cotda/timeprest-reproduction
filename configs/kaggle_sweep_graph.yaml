# LR sweep after switching TiMePReSt to backward_rule "graph" (paper_notes §22.6-22.7): the graph
# rule diverged at lr 0.05 (Kaggle D4) and collapses at lr >= 0.1 in a CPU reproduction, while the
# recompute rule and PipeDream train. Single-GPU simulation (phase-1 engine), one T4, ~20-25 min:
#     python -m timeprest.sweep --config configs/kaggle_sweep_graph.yaml
base: kaggle_base.yaml
name: sweep_graph
data:
  train_subset: 20000
  test_subset: 2000
training:
  epochs: 8
  warmup_epochs: 2
output:
  dir: /kaggle/working/sweep_graph
  require_checks: false
sweep:
  lrs: [0.05, 0.02, 0.01, 0.005]
  variants:                       # name -> config overrides
    timeprest_graph: {system: timeprest}
    timeprest_recompute: {system: timeprest_recompute}
    pipedream: {system: pipedream}
