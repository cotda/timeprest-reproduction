# Phase 2: real 2-stage pipeline on Kaggle T4 x2 (one process per GPU, NCCL).
# Same training recipe as phase 1 (base_cifar100.yaml); only data/output paths and runtime differ.
base: base_cifar100.yaml
data:
  root: /kaggle/input/datasets/fedesoriano/cifar100   # Kaggle dataset; files train/test/meta may sit directly here
  download: false
  num_workers: 2
training:
  # paper gives no learning rate and only fixes a common mini-batch size (§4.5, p.8): each system
  # uses its own best lr from configs/kaggle_sweep_graph.yaml, which is 0.02 for both
  # (TiMePReSt graph 34.7 %, PipeDream 35.95 %; paper_notes §22.8-22.9)
  lr: 0.02
dist:
  p2p_backend: gloo               # stage-to-stage transfers through CPU + helper threads (as PipeDream)
  env:
    GLOO_SOCKET_IFNAME: lo        # single node: gloo p2p over loopback
    # default process group (barrier / all_gather) via host shared memory: verified on Kaggle
    NCCL_P2P_DISABLE: "1"
    # each fwd/bwd process group is one-directional, so per-group serialization is intended
    TORCH_NCCL_SHOW_EAGER_INIT_P2P_SERIALIZATION_WARNING: "false"
pipeline:
  order: dynamic                  # paper §3.2: backward first when its gradient has arrived
  backward_mode: auto             # keep the forward graph when F/B versions match, else recompute
  sync_each_op: true
output:
  dir: /kaggle/working/runs/{name}
  checks_file: results/checks/dist_latest.json
