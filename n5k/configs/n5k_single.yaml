# 1-GPU reference (ordinary training, no pipeline): python -m timeprest.n5k.train
base: n5k_base.yaml
name: n5k_single_s0
system: pipedream                        # with one stage = plain SGD on the whole mini-batch
pipeline:
  num_stages: 1
  partition: auto                        # one stage = all blocks (the 2-GPU split of n5k_base does not apply)
