# Nutrition5k + TiMePReSt (n5k/PLAN.md). Values = mục 4-6 of the plan; change them only with a
# decision logged in mục 10.
name: n5k_base
seed: 0
system: timeprest
data:
  dataset: nutrition5k
  root: /kaggle/input                    # searched for dish_nutrition_values.csv
  split_dir: n5k/splits                  # fixed split of Exp 1-3 (dish ids)
  cache_dir: /kaggle/working/n5k_cache   # decoded uint8 RGB + uint16 depth .npy (built once)
  cache_search: /kaggle/input            # a ready cache uploaded as a Kaggle dataset is used directly
  image_size: 224
  augment: true                          # joint horizontal / vertical flips of RGB and depth
  num_workers: 2
  decode_threads: 16                     # parallel PNG reads when building the cache (I/O latency bound)
  progress_every: 250                    # cache build progress line every N dishes
model:
  name: n5k_resnet50
  in_channels: 4                         # RGB + depth
  pretrained: IMAGENET1K_V2              # torchvision weights; depth filter = mean of RGB filters
  direct_totals: true                    # extra 1x1-conv branch predicting the dish totals (run4, PLAN mục 10)
loss:
  w_presence: 1.0
  w_gram: 1.0
  w_total: 1.0
  ingredient_reduce: sum                 # mean | sum over the K ingredients (presence + gram terms); sum: run4 (PLAN mục 10)
pipeline:
  num_stages: 2                          # W
  num_microbatches: 2                    # N (user, 2026-10-14)
  partition: [0, 8, 18]                  # measured on 2xT4 (run1c, n5k/PLAN.md mục 10); auto (MACs) gave [0, 9, 18]
training:
  epochs: 30
  batch_size: 64                         # M
  optimizer: sgd
  lr: 0.02                               # best of the final sweep (run3) for single / DDP / pipedream (PLAN mục 11)
  momentum: 0.9
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_epochs: 2
runtime:
  device: cuda
  eval_batch_size: 64
  profile_ops: true
  op_trace_every: 10
output:
  dir: n5k/results/runs/{name}
  require_checks: true
  checks_file: n5k/results/checks/latest.json
checks:
  systems: [pipedream, timeprest]
  num_microbatches: 2
  static_batch: 16
  static_steps: 4
  dynamic_steps: 10
  resume_subset: 256
  short_epochs: 2
  short_warmup_epochs: 0.5
explain:                                 # B7: python -m timeprest.n5k.explain (PLAN mục 10, 2026-10-16)
  presence_threshold: 0.5                # ingredient predicted present (same threshold as F1)
  cells: [2, 5, 10]                      # masked cells of the h x w head grid (7 x 7 at 224 px, 32 px cells)
  random_draws: 5                        # random-cell control: mean of this many draws
  rule_cells: 5                          # the decision rule uses this c ...
  rule_alpha: 0.01                       # ... and this one-sided paired Wilcoxon level
  figure_dishes: 8                       # half at kcal-error quantiles, half at random
  top_cams: 3                            # CAM panels per figure (highest presence probabilities)
  seed: 0
  dir: n5k/results/explain/{name}
